name: instagram_clone
description: Instagram clone with BLoC and local storage
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  video_player: ^2.9.1
  path_provider: ^2.1.3
  fc_native_video_thumbnail: ^4.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/instalogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/instalogo.png"

dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true